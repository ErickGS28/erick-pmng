
spring.application.name=people-again

db.host=${ENV_DB_HOST:localhost}
db.port=${ENV_DB_PORT:3306}
db.name=${ENV_DB_NAME:people-dev}


# Conexión a MySQL. En local apunta a localhost.
spring.datasource.url=${ENV_DB_URL:jdbc:mysql://${db.host}:${db.port}/${db.name}?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DC_DB_USER:root}
spring.datasource.password=${DC_DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${DC_SERVER_PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true               
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect